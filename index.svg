
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%" viewBox="0 0 500 600">

  <rect width="500" height="600" fill="#080808"/>

  <foreignObject x="25" y="20" width="450" height="560">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }

        body {
          margin: 0;
          background: #080808;
          color: #eee;
          font-family: Arial, sans-serif;
        }

        .container {
          width: 100%;
          padding: 65px 35px;
          text-align: center;
        }

        .logo {
          font-size: 46px;
          color: #eee;
          margin-bottom: 15px;
        }

        h1 {
          font-size: 25px;
          letter-spacing: 6px;
          margin: 0;
        }

        p {
          color: #777;
          font-size: 11px;
          letter-spacing: 2px;
          margin: 12px 0 30px;
        }

        button {
          display: flex;
          align-items: center;
          width: 100%;
          padding: 17px;
          margin: 10px 0;
          background: #111;
          border: 1px solid #303030;
          border-radius: 8px;
          color: #eee;
          font-size: 14px;
          text-align: left;
          cursor: pointer;
        }

        button:hover {
          background: #202020;
          border-color: #666;
        }

        .icon {
          width: 25px;
          margin-right: 15px;
          font-size: 20px;
          text-align: center;
        }

        .num {
          margin-left: auto;
          color: #555;
          font-size: 11px;
        }
      </style>

      <div class="container">
        <div class="logo">⁜</div>
        <h1>LAUNCH</h1>
        <p>SELECT A DESTINATION</p>

        <button onclick="launch('https://dashboard.blooket.lol/')">
          <span class="icon">◉</span>
          Oxygen <span class="num">01</span>
        </button>

        <button onclick="launch('https://s3.us-east-1.amazonaws.com/zoxh/index.html')">
          <span class="icon">☻</span>
          tung tung <span class="num">02</span>
        </button>

        <button onclick="launch('https://mizu.hellohealthiness.co.uk/')">
          <span class="icon">◈</span>
          mizu <span class="num">03</span>
        </button>

        <button onclick="launch('https://s3.amazonaws.com/math26/index.html')">
          <span class="icon">▦</span>
          material <span class="num">04</span>
        </button>
      </div>

      <script>
        function launch(url) {
          const w = window.open("about:blank", "_self");
          w.document.open();
          w.document.write(
            '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}</style></head><body><iframe src="' +
            url.replace(/&/g, '&amp;').replace(/"/g, '&quot;') +
            '" allowfullscreen></iframe></body></html>'
          );
          w.document.close();
        }
      </script>
    </div>
  </foreignObject>
</svg>
